[pytest]
DJANGO_SETTINGS_MODULE = backend.kyc_system.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = backend
addopts =
    -ra
    -q
    --strict-markers
    --tb=short
markers =
    slow: tests that take >1s
    integration: DB + Celery combined
